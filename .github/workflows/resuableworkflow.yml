name: Reusable Deploy

on:
  workflow_call:
    inputs:
      artifact-name:
        required: false
        default: dist-files
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}

      - name: List files
        run: ls

      - name: Output information
        run: echo "Deploying n uploading"